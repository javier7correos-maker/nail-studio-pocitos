services:
  - type: web
    name: nail-studio-pocitos-reservas
    runtime: python
    plan: free
    rootDir: src/backend
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
